# Pi Desktop Agent 릴리스 (설계 DESIGN-AGENT.md §0 "릴리스").
# agent-v로 시작하는 태그(예: agent-v0.1.0)를 올리면 Windows·macOS·Linux 설치 파일을 만들어
# 에이전트 전용 배포 저장소(apps/agent/electron-builder.yml의 publish)에 v<버전> 릴리스로 올린다.
#   git tag agent-v0.1.0 && git push origin agent-v0.1.0
# Pi Desktop의 릴리스(release.yml, v* 태그)와는 태그도 올리는 곳도 나눈다. 같은 Releases에 올리면
# Pi Desktop의 자동 업데이트가 에이전트 릴리스를 최신 버전으로 착각하기 때문이다.
# Actions 탭에서 손으로 돌리면(workflow_dispatch) 만들기만 하고 올리지 않는다 (릴리스 전 미리 확인).
#
# 올리려면 배포 저장소에 쓸 수 있는 토큰이 저장소 시크릿 AGENT_RELEASE_TOKEN에 있어야 한다
# (이 저장소의 GITHUB_TOKEN은 다른 저장소에 쓸 수 없다).
name: Release Agent

on:
  push:
    tags: ["agent-v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  # 배포 저장소. electron-builder.yml의 publish와 같아야 앱의 자동 업데이트가 같은 곳을 본다
  RELEASE_REPO: skax-soulfactor/pi-desktop-agent

jobs:
  build:
    name: 빌드 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: true
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: agent-kit 테스트
        run: npm test -w @pi-desktop/agent-kit

      - name: 앱 버전을 태그에 맞추기
        if: startsWith(github.ref, 'refs/tags/agent-v')
        shell: bash
        run: npm version "${GITHUB_REF_NAME#agent-v}" --no-git-tag-version --allow-same-version -w @pi-desktop/agent

      - name: 설치 파일 만들기
        run: npm run dist -w @pi-desktop/agent

      - name: 결과물 넘기기
        uses: actions/upload-artifact@v4
        with:
          name: agent-release-${{ matrix.os }}
          if-no-files-found: error
          path: |
            apps/agent/release/*.exe
            apps/agent/release/*.dmg
            apps/agent/release/*.zip
            apps/agent/release/*.AppImage
            apps/agent/release/*.deb
            apps/agent/release/*.blockmap
            apps/agent/release/latest*.yml

  publish:
    name: 배포 저장소에 올리기
    needs: build
    if: startsWith(github.ref, 'refs/tags/agent-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 릴리스 만들기
        env:
          GH_TOKEN: ${{ secrets.AGENT_RELEASE_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::시크릿 AGENT_RELEASE_TOKEN이 없습니다. $RELEASE_REPO에 쓸 수 있는 토큰을 저장소 시크릿에 넣으세요."
            exit 1
          fi
          VERSION="v${GITHUB_REF_NAME#agent-v}"
          ls -la dist
          gh release create "$VERSION" dist/* \
            --repo "$RELEASE_REPO" \
            --title "Pi Desktop Agent $VERSION" \
            --notes "skax-soulfactor/pi-desktop@${GITHUB_SHA::7} ($GITHUB_REF_NAME)에서 만들었습니다."
