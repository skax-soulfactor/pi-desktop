# Pi Desktop Agent 릴리스 (설계 DESIGN-AGENT.md §0 "릴리스").
# agent-v로 시작하는 태그(예: agent-v0.1.0)를 올리면 Windows·macOS·Linux 설치 파일을 만들어 이 저장소의 GitHub Releases에 올린다.
#   git tag -a agent-v0.1.0 -m "Pi Desktop Agent v0.1.0" && git push origin agent-v0.1.0
# Actions 탭에서 손으로 돌리면(workflow_dispatch) 세 OS에서 만들기만 하고 올리지 않는다 (릴리스 전 미리 확인).
#
# Pi Desktop(release.yml, v* 태그)·Pi Desktop Mate(mate-release.yml, mate-v* 태그)와 섞이지 않게 한다:
# - 태그 이름이 달라 서로의 워크플로를 깨우지 않는다 ("v*"는 agent-v…와 맞지 않음)
# - Agent 릴리스는 "Latest"로 표시하지 않는다. Pi Desktop의 자동 업데이트는 Latest 릴리스의 latest.yml을 보기 때문이다
# - Agent는 아직 자동 업데이트가 없어 latest*.yml을 올리지 않는다
# 코드 서명은 하지 않는다.
name: Release Agent

on:
  push:
    tags: ["agent-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: 빌드 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: true
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: agent-kit 테스트
        run: npm test -w @pi-desktop/agent-kit

      - name: 앱 버전을 태그에 맞추기
        if: startsWith(github.ref, 'refs/tags/agent-v')
        shell: bash
        run: npm version "${GITHUB_REF_NAME#agent-v}" --no-git-tag-version --allow-same-version -w @pi-desktop/agent

      - name: 설치 파일 만들기
        run: npm run dist -w @pi-desktop/agent

      - name: 결과물 넘기기
        uses: actions/upload-artifact@v4
        with:
          name: agent-release-${{ matrix.os }}
          if-no-files-found: error
          path: |
            apps/agent/release/*.exe
            apps/agent/release/*.dmg
            apps/agent/release/*.AppImage
            apps/agent/release/*.deb

  publish:
    name: GitHub Releases에 올리기
    needs: build
    if: startsWith(github.ref, 'refs/tags/agent-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 릴리스 만들기 (Latest로 표시하지 않음)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -la dist
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Pi Desktop Agent ${GITHUB_REF_NAME#agent-}" \
            --notes "Pi Desktop Agent 설치 파일입니다. Pi Desktop과 별도 앱이며 자동 업데이트는 아직 없습니다. 설치된 Pi가 필요합니다. 설명: apps/agent/README.md" \
            --latest=false
