# 릴리스: v로 시작하는 태그(예: v0.6.4)를 올리면 세 앱(Pi Desktop·Agent·Mate)의 Windows·macOS·Linux 설치 파일과
# 웹(pi-web) 묶음 pi-web.tar.gz, Android Termux 설치 스크립트 install-termux.sh를 만들어 GitHub Releases의 한 릴리스에 올린다.
#   curl -fsSL https://github.com/<저장소>/releases/latest/download/install-termux.sh | bash
#   git tag v0.6.4 && git push origin v0.6.4
#
# 0.6.4부터 세 앱이 한 릴리스에 함께 올라간다 (그 전에는 v*·agent-v*·mate-v* 릴리스가 따로 있었다).
# 자동 업데이트 정보 파일은 앱마다 이름이 달라 한 릴리스에서 겹치지 않는다 (각 앱 electron-builder.yml의 publish):
# - Pi Desktop: latest.yml·latest-mac.yml·latest-linux.yml (GitHub 방식: Latest 릴리스를 본다)
# - Agent: agent.yml·agent-mac.yml·agent-linux.yml, Mate: mate.yml·mate-mac.yml·mate-linux.yml
#   (generic 방식: 릴리스 목록에서 가장 높은 v*를 찾아 그 내려받기 주소의 자기 채널 파일을 본다)
#
# Actions 탭에서 손으로 돌릴 때(workflow_dispatch):
#   - version을 비우면 만들기만 하고 올리지 않는다 (릴리스 전 미리 확인)
#   - version(예: v0.6.4)을 넣으면 고른 브랜치의 커밋에 그 태그를 만들고 릴리스까지 올린다.
#     태그를 push할 수 없는 곳(휴대폰의 GitHub 앱, 브랜치에만 push하는 자동화)에서 릴리스할 때 쓴다
# 코드 서명은 하지 않는다 (README "설치와 업데이트" 참고).
#
# 0.7.0부터 설치본은 Pi Desktop 하나다 (Agent·Mate는 그 안의 작업 공간, DESIGN-ONE-APP.md).
# Agent·Mate 설치 파일은 징검다리 v0.7.0에서만 만든다: 옛 단독 설치본이 이 버전으로 마지막 업데이트를 받아
# "Pi Desktop으로 합쳐졌습니다"를 보인다. 그 뒤 릴리스에는 agent*.yml·mate*.yml이 없어 옛 설치본은 0.7.0에서 멈춘다.
# 만들기만 할 때(version 비움) 징검다리도 만들어 보려면 bridge를 켠다.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "릴리스할 버전 (예: v0.6.4). 비우면 만들기만 하고 올리지 않는다"
        required: false
        default: ""
      bridge:
        description: "만들기만 할 때 Agent·Mate 징검다리도 만든다 (v0.7.0은 늘 만든다)"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

env:
  # 태그 push면 그 태그, 손으로 돌렸으면 입력한 버전. 비었으면 릴리스하지 않는다
  RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}

jobs:
  build:
    name: 빌드 (${{ matrix.app }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      # Pi Desktop은 늘, Agent·Mate(징검다리)는 v0.7.0에서만 만든다 (위 설명)
      BUILD_APP: ${{ matrix.app == 'desktop' || (github.ref_type == 'tag' && github.ref_name == 'v0.7.0') || inputs.version == 'v0.7.0' || (inputs.version == '' && inputs.bridge) }}
    strategy:
      fail-fast: true
      matrix:
        app: [desktop, agent, mate]
        os: [windows-latest, macos-latest, ubuntu-latest]
        include:
          # 앱마다 자동 업데이트 정보 파일 이름 (electron-builder.yml의 publish)
          - app: desktop
            updateFiles: latest*.yml
          - app: agent
            updateFiles: agent*.yml
          - app: mate
            updateFiles: mate*.yml
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        if: env.BUILD_APP == 'true'
        with:
          node-version: 24
          cache: npm

      - name: 의존성 설치
        if: env.BUILD_APP == 'true'
        run: npm ci

      - name: agent-kit 테스트
        if: env.BUILD_APP == 'true' && matrix.app == 'desktop'
        run: npm test -w @pi-desktop/agent-kit

      - name: 앱 버전을 태그에 맞추기
        if: env.BUILD_APP == 'true' && env.RELEASE_TAG != ''
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]] || { echo "버전은 v1.2.3 모양이어야 합니다: $RELEASE_TAG"; exit 1; }
          npm version "${RELEASE_TAG#v}" --no-git-tag-version --allow-same-version -w "@pi-desktop/${{ matrix.app }}"
          # Host Agent 데몬(Pi Desktop·Agent가 싣는다)도 같은 번호로 빌드한다. 안 하면 데몬이 늘 package.json의 0.0.1로 보인다
          npm version "${RELEASE_TAG#v}" --no-git-tag-version --allow-same-version -w @pi-desktop/host-agent

      - name: 설치 파일 만들기
        if: env.BUILD_APP == 'true'
        run: npm run dist -w "@pi-desktop/${{ matrix.app }}"

      - name: 결과물 넘기기
        if: env.BUILD_APP == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.app }}-${{ matrix.os }}
          if-no-files-found: error
          path: |
            apps/${{ matrix.app }}/release/*.exe
            apps/${{ matrix.app }}/release/*.dmg
            apps/${{ matrix.app }}/release/*.zip
            apps/${{ matrix.app }}/release/*.AppImage
            apps/${{ matrix.app }}/release/*.deb
            apps/${{ matrix.app }}/release/*.blockmap
            apps/${{ matrix.app }}/release/${{ matrix.updateFiles }}

  web:
    name: 웹(pi-web) 묶음
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # 웹 묶음에는 Electron 실행 파일이 필요 없다
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: 앱 버전을 태그에 맞추기
        if: env.RELEASE_TAG != ''
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]] || { echo "버전은 v1.2.3 모양이어야 합니다: $RELEASE_TAG"; exit 1; }
          npm version "${RELEASE_TAG#v}" --no-git-tag-version --allow-same-version -w @pi-desktop/desktop -w @pi-desktop/host-agent

      # 세 앱의 웹 빌드를 한 묶음으로 모은다 (루트 scripts/build-web.mjs). 버전은 위에서 맞춘 Pi Desktop 버전을 따른다
      # 설치 스크립트에는 이 저장소(GITHUB_REPOSITORY)가 들어간다
      - name: 묶음과 설치 스크립트 만들기
        run: npm run dist:web

      - name: 결과물 넘기기
        uses: actions/upload-artifact@v4
        with:
          name: release-web
          if-no-files-found: error
          path: |
            release/web/pi-web.tar.gz
            release/web/install-termux.sh

  publish:
    name: GitHub Releases에 올리기
    needs: [build, web]
    if: github.ref_type == 'tag' || inputs.version != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 릴리스 만들기
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -la dist
          # 앱마다 업데이트 정보 파일이 있어야 자동 업데이트가 된다 (없으면 올리지 않고 멈춘다)
          files="latest.yml latest-linux.yml"
          # 징검다리(v0.7.0)는 옛 Agent·Mate 설치본이 볼 파일도 있어야 한다
          [ "$RELEASE_TAG" = v0.7.0 ] && files="$files agent.yml mate.yml agent-linux.yml mate-linux.yml"
          for f in $files; do
            [ -f "dist/$f" ] || { echo "업데이트 정보 파일이 없습니다: $f"; exit 1; }
          done
          # 손으로 돌렸으면 태그가 아직 없다. --target의 커밋(빌드한 커밋)에 태그를 만든다
          gh release create "$RELEASE_TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Pi Desktop $RELEASE_TAG" \
            --notes "Pi Desktop(Agent·Mate 작업 공간 포함)과 휴대폰 웹 버전(pi-web) 설치 파일입니다. 설치한 앱은 앱 안에서 자동 업데이트됩니다(Windows·AppImage, macOS는 새 버전을 알림). v0.7.0에는 옛 단독 Agent·Mate 설치본을 위한 마지막 징검다리 파일(Pi-Desktop-Agent-*, Pi-Desktop-Mate-*)도 있습니다." \
            --generate-notes
