<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Pi Desktop 아이콘 원본. scripts/render-icon.mjs가 이것으로 build/icon.png(1024)를 만든다. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1f3b"/>
      <stop offset="0.55" stop-color="#2a2466"/>
      <stop offset="1" stop-color="#5b2fa8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.22" r="0.75">
      <stop offset="0" stop-color="#8f7bff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#8f7bff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pi" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dcd6ff"/>
    </linearGradient>
    <linearGradient id="cursor" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2ee6c9"/>
      <stop offset="1" stop-color="#4fb3ff"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0b0820" flood-opacity="0.55"/>
    </filter>
    <filter id="neon" x="-50%" y="-200%" width="200%" height="500%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- 바탕: 둥근 사각형 -->
  <rect x="48" y="48" width="928" height="928" rx="212" fill="url(#bg)"/>
  <rect x="48" y="48" width="928" height="928" rx="212" fill="url(#glow)"/>
  <rect x="49.5" y="49.5" width="925" height="925" rx="210.5" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="3"/>

  <!-- π -->
  <g filter="url(#soft)" fill="none" stroke="url(#pi)" stroke-linecap="round" stroke-linejoin="round">
    <!-- 가로 막대: 왼쪽이 살짝 처진 붓질 -->
    <path d="M 262 352 C 330 318, 420 310, 520 312 C 610 313, 690 318, 772 308" stroke-width="92"/>
    <!-- 왼쪽 다리: 아래로 갈수록 왼쪽으로 휘는 획 -->
    <path d="M 418 330 C 414 470, 392 600, 330 724" stroke-width="88"/>
    <!-- 오른쪽 다리: 곧게 내려와 끝이 오른쪽으로 꺾인다 -->
    <path d="M 628 330 C 622 470, 620 600, 650 688 C 664 728, 700 742, 742 728" stroke-width="88"/>
  </g>

  <!-- 터미널 커서 -->
  <g filter="url(#neon)">
    <rect x="690" y="792" width="160" height="44" rx="22" fill="url(#cursor)"/>
  </g>
</svg>
