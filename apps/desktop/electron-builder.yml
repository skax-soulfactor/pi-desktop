# 설치 파일 만들기 (설계 §6 "electron-builder", M5 인스톨러·자동 업데이트).
# 로컬: npm run dist -w @pi-desktop/desktop   (지금 OS용, 올리지 않음)
# 릴리스: v로 시작하는 태그를 올리면 .github/workflows/release.yml이 세 OS에서 만들어 GitHub Releases에 올린다.
appId: dev.pi-desktop.app
productName: Pi Desktop
copyright: Copyright © skax-soulfactor

directories:
  output: release
  buildResources: build

# 설치본의 package.json 이름. 워크스페이스 이름(@pi-desktop/desktop) 대신 써서 업데이트 캐시 폴더 이름 등이 깔끔하다.
extraMetadata:
  name: pi-desktop

# electron-vite가 만든 결과물만 담는다. 화면(React 등)은 이미 번들에 들어 있다.
files:
  - out/**
  - package.json

# Host Agent는 앱 밖에서(로컬 node·WSL·SSH) 도는 파일이라 asar에 넣지 않고 리소스로 둔다.
extraResources:
  - from: ../../packages/host-agent/dist/host-agent.mjs
    to: host-agent/host-agent.mjs
  - from: ../../packages/host-agent/package.json
    to: host-agent/package.json

# node-pty는 네이티브 모듈이라 asar 밖에 풀어 둔다.
# N-API 모듈이라 Electron에 맞춰 다시 빌드하지 않는다 (Windows·macOS는 미리 빌드된 파일, Linux는 npm ci 때 빌드한 것을 쓴다).
asarUnpack:
  - "**/node_modules/node-pty/**"
npmRebuild: false

# 자동 업데이트가 확인하는 곳. 태그 v<버전>의 릴리스에 latest*.yml과 설치 파일이 올라간다.
publish:
  provider: github
  owner: skax-soulfactor
  repo: pi-desktop
  releaseType: release

win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: Pi-Desktop-Setup-${version}.${ext}
  # 코드 서명 인증서가 없으면 서명하지 않는다 (설치할 때 SmartScreen 경고가 나온다).
  signAndEditExecutable: true

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  deleteAppDataOnUninstall: false

mac:
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
  category: public.app-category.developer-tools
  artifactName: Pi-Desktop-${version}-${arch}.${ext}
  # Apple Developer ID가 없으므로 서명하지 않는다. 서명이 없으면 macOS 자동 설치가 되지 않아 앱은 내려받을 곳만 알린다.
  identity: null

linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  category: Development
  maintainer: skax-soulfactor
  artifactName: Pi-Desktop-${version}-${arch}.${ext}
